name: Публикация на reg.ru по FTP

# Любое изменение в рабочей ветке — хоть из чата, хоть вручную — собирает сайт
# и выкладывает его на хостинг. Отдельно есть кнопка «Run workflow» на вкладке
# Actions, если нужно перезалить без изменений.
on:
  push:
    branches: [claude/practical-dijkstra-a0c9pq, main]
  workflow_dispatch:

# Два деплоя подряд не должны класть файлы друг поверх друга.
concurrency:
  group: ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Условие шага не умеет читать секреты напрямую — GitHub такой файл просто
    # не принимает. Поэтому адрес сервера переносится в переменную задачи, и
    # проверяется уже она.
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      # На своём домене сайт лежит в корне, поэтому префикс пути не задаётся —
      # в отличие от сборки для GitHub Pages, которая живёт в подпапке.
      - name: Сборка
        run: npm run build
        env:
          VITE_YANDEX_METRIKA_ID: ${{ secrets.YANDEX_METRIKA_ID || '113673011' }}
          # Коды подтверждения сайта в Вебмастере и Search Console — не секретные.
          VITE_YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION || 'a211b52f326f55d4' }}
          VITE_GOOGLE_VERIFICATION: ${{ vars.GOOGLE_VERIFICATION }}
          # Адрес приёма заявок (Google Apps Script). Пока не задан — формы в демо-режиме.
          # Адрес не секретный: он всё равно попадает в код сайта, который видит
          # каждый посетитель. Секрет LEADS_ENDPOINT, если задан, главнее.
          VITE_LEADS_ENDPOINT: ${{ secrets.LEADS_ENDPOINT || 'https://script.google.com/macros/s/AKfycbzwpQzG45E3f8VzF9sAInhfK3qAuCSs_XdG8tdh0Z6L25SdKH993moO_XObNdu5cnDOmw/exec' }}

      # Пока доступы не заведены, шаг пропускается и сборка просто проверяется.
      - name: Загрузка на хостинг
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Папка сайта на хостинге. У reg.ru это обычно /www/вашдомен/
          server-dir: ${{ secrets.FTP_DIR }}
          local-dir: ./dist/
          # Обычный FTP. Оба шифрованных варианта хостинг не принимает:
          # явный FTPS пускает по логину, но отказывается открывать канал
          # передачи данных («425 Operation not permitted»), а неявный отвечает
          # открытым текстом там, где ожидается TLS. Переключить обратно можно
          # переменной FTP_PROTOCOL на вкладке Variables.
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          # Файлы прошлой сборки с другими именами удаляются, чтобы в папке не
          # копился мусор; эти — трогать нельзя.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
